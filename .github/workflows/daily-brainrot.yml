name: Daily Brainrot Videos

# Free cloud scheduling. Runs daily; also runnable on demand.
#
# Uploads go through upload-post.com, which handles YouTube + TikTok auth
# on their side. One API key replaces both Google OAuth and TikTok OAuth.
#
# Required GitHub secrets (at
# github.com/hzisow/Youtube-Automation/settings/secrets/actions):
#
#   UPLOADPOST_API_KEY    JWT from your upload-post.com dashboard.
#   UPLOADPOST_USER       The user label assigned in upload-post (e.g.
#                         "tiktokuploader") that maps to your connected
#                         YouTube + TikTok accounts.
#   GAMEPLAY_URL          (optional fallback) Direct .mp4 link, used only if
#                         the clip release below has no .mp4 assets.
#
# BACKGROUND CLIPS: upload .mp4 files to the GitHub Release tagged
# "assets-v1". Every run queries that release, lists its .mp4 assets, and
# picks one at random. Drag a new clip into the release and it joins the
# rotation immediately -- no secret edits, no code changes.
#   https://github.com/hzisow/Youtube-Automation/releases/tag/assets-v1

on:
  schedule:
    # Two trigger windows per day. Each independently rolls a 38% dice
    # to actually post + sleeps 0-180 random minutes before doing so.
    # Math: 2 triggers * 0.38 ~= 0.76 posts/day ~= 3 posts per 4 days.
    - cron: "0 14 * * *"   # 10:00 AM ET trigger (posts 10 AM - 1 PM ET)
    - cron: "0 22 * * *"   #  6:00 PM ET trigger (posts  6 PM - 9 PM ET)
  workflow_dispatch:
    inputs:
      count:
        description: "Bulk count for manual runs (scheduled runs upload 1 each)"
        default: "1"

env:
  ENABLE_PUBLISH: "true"
  YOUTUBE_PRIVACY: "public"  # public / unlisted / private
  TTS_ENGINE: "piper"        # piper (open-source, local) or edge (cloud)
  CLIP_RELEASE_TAG: "assets-v1"  # release holding the background .mp4 clips
  PIPER_LENGTH_SCALE: "0.78" # narration speed, LOWER = FASTER (1.0 = natural)

jobs:
  dice:
    runs-on: ubuntu-latest
    outputs:
      should_post: ${{ steps.roll.outputs.should_post }}
    steps:
      - id: roll
        name: Roll dice for cadence (~3 posts per 4 days)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run -> posting unconditionally."
            echo "should_post=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROLL=$((RANDOM % 100))
          THRESH=38
          if [ $ROLL -lt $THRESH ]; then
            echo "Rolled $ROLL (< $THRESH): POSTING this slot."
            echo "should_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rolled $ROLL (>= $THRESH): skipping this slot."
            echo "should_post=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: dice
    if: needs.dice.outputs.should_post == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    defaults:
      run:
        working-directory: brainrot-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Random pre-post sleep (0-180 min) so post time varies
        if: github.event_name == 'schedule'
        run: |
          SLEEP_MIN=$((RANDOM % 180))
          echo "Sleeping $SLEEP_MIN minutes before kicking off the render."
          sleep $((SLEEP_MIN * 60))

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: brainrot-pipeline/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Piper voice models + Whisper model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/piper
            ~/.cache/huggingface
          key: tts-models-v1

      - name: Fetch a random gameplay clip
        env:
          GAMEPLAY_URL: ${{ secrets.GAMEPLAY_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${CLIP_RELEASE_TAG}"
          echo "Looking for .mp4 clips in release '${CLIP_RELEASE_TAG}'..."
          URLS=$(curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" \
                      -H "Accept: application/vnd.github+json" "$API" \
                 | jq -r '.assets[]? | select(.name | ascii_downcase | endswith(".mp4")) | .browser_download_url' \
                 || true)
          COUNT=$(printf '%s' "$URLS" | grep -c . || true)
          if [ "${COUNT:-0}" -gt 0 ]; then
            PICK=$(printf '%s\n' "$URLS" | shuf -n 1)
            echo "Found ${COUNT} clip(s) in the release. This run uses: $(basename "$PICK")"
          else
            PICK="$GAMEPLAY_URL"
            echo "No .mp4 assets found in release '${CLIP_RELEASE_TAG}'; falling back to the GAMEPLAY_URL secret."
          fi
          if [ -z "$PICK" ]; then
            echo "::error::No gameplay clip available. Upload .mp4 files to the '${CLIP_RELEASE_TAG}' release, or set the GAMEPLAY_URL secret."
            exit 1
          fi
          curl -fL "$PICK" -o assets/gameplay.mp4
          ls -lh assets/gameplay.mp4

      - name: Generate and upload
        env:
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          TTS_ENGINE: ${{ env.TTS_ENGINE }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          FLAGS="--count $COUNT --style story --cache stories_cache.json"
          if [ "$ENABLE_PUBLISH" = "true" ]; then
            FLAGS="$FLAGS --upload --tiktok --privacy $YOUTUBE_PRIVACY"
          fi
          python auto.py $FLAGS

      - name: Persist used.json so tomorrow's run skips today's stories
        if: always()
        run: |
          if [ -f used.json ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add used.json
            git diff --staged --quiet || git commit -m "chore: update used.json [skip ci]"
            git push || true
          fi

      - name: Upload finished videos as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-videos
          path: brainrot-pipeline/output/*.mp4
          if-no-files-found: ignore
